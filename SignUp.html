<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./output.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex">
    <!-- LOGIN -->
    <div class="w-1/2 flex items-center justify-center bg-white px-8">
        <div class="w-full max-w-md">
            <div class="flex items-center gap-3 mb-14">
                <div class="text-3xl">
                    🌟
                </div>
                <h2 class="text-xl font-bold text-gray-900">
                    Ruang Aksara
                </h2>
            </div>

            <!-- Judul -->
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-gray-900 mb-2">
                    Sig Up to your account
                </h1>
                <p class="text-sm text-gray-600">
                    Please enter your details
                </p>

            </div>


            <form>
                <!-- Email -->
                <div class="mb-5">
                    <label
                        for="email"
                        class="block text-sm font-medium text-gray-800 mb-2">
                            Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        class="w-full h-12 px-4 border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition">
                </div>

                <!-- Password -->
                <div class="mb-11">
                    <label
                        for="password"
                        class="block text-sm font-medium text-gray-800 mb-2">
                            Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        class="w-full h-12 px-4 border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition">
                </div>

                <!-- Button -->
                <button
                    type="submit"
                    class="w-full h-12 bg-blue-900 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition duration-200">
                        Sign Up
                </button>
            </form>

            <!-- Sign Up -->
            <p class="text-center text-sm text-gray-700 mt-3">
                Do you have account?
                <a
                    href="./login.html"
                    class="text-blue-500 hover:text-blue-700">
                        Log In
                </a>
            </p>
        </div>
    </div>

    <div class="w-1/2">
        <img
            src="./assets/download (24).jpg"
            alt="Login Image"
            class="w-full h-screen object-cover">
    </div>

</body>
</html>
