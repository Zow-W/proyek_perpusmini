<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Favorit</title>
    <link rel="stylesheet" href="./src/output.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body>
    <!-- SIDEBAR -->
    <aside class="fixed top-0 left-0 w-[230px] h-screen bg-slate-900 text-white px-5 py-5">
      <div class="flex items-center">
        <div class="w-20 h-20 flex items-center justify-center">
          <img
            src="./assets/logo.png"
            class="w-20 h-20 object-contain"
            alt="Logo"
          />
        </div>
        <div>
          <h1 class="font-bold text-[13px] tracking-wide">RUANG AKSARA</h1>
          <p class="text-[7px] text-gray-300">Perpustakaan Digital</p>
        </div>
      </div>

      <nav class="flex flex-col gap-2 mt-2">
        <a
          href="./home.html"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-[#0a3d67] transition text-white text-[11px]">
          <iconify-icon icon="akar-icons:home-alt1" width="18"></iconify-icon>
          <span>Beranda</span>
        </a>

        <details class="group">
            <summary class="flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-[#0a3d67] transition text-white text-[11px] hover:bg-[#0a3d67] transition cursor-pointer list-none">
                <div class="flex items-center gap-3">
                    <iconify-icon icon="akar-icons:book" width="18"></iconify-icon>
                    <a href="./daftarKoleksi.html">Daftar Koleksi</a>
                </div>

                <iconify-icon icon="solar:alt-arrow-down-linear" width="15" class="transition-transform duration-300 group-open:rotate-180"></iconify-icon>
            </summary>

            <div class="ml-9 mt-1 space-y-1">
                <a href="#" class="block text-[12px] text-gray-300 hover:text-white py-1">
                    Romance
                </a>

                <a href="#" class="block text-[12px] text-gray-300 hover:text-white py-1">
                     Fiksi
                </a>

                <a href="#" class="block text-[12px] text-gray-300 hover:text-white py-1">
                     Survive
                </a>
                <a href="#" class="block text-[12px] text-gray-300 hover:text-white py-1">
                     Horror
                </a>
                <a href="#" class="block text-[12px] text-gray-300 hover:text-white py-1">
                     thriller
                </a>
                <a href="#" class="block text-[12px] text-gray-300 hover:text-white py-1">
                     Islamic
                </a>
            </div>
        </details>

        <a
          href="./bukuFavorit.html"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg  bg-[#0a3d67] text-white text-[11px]">
          <iconify-icon icon="lucide:bookmark" width="18"></iconify-icon>
          <span>Buku Favorit</span>
        </a>

        <a
          href="./keranjang.html"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white text-[11px] hover:bg-[#0a3d67] transition">
          <iconify-icon
            icon="eva:shopping-bag-outline"
            width="19"
          ></iconify-icon>
          <span>Keranjang</span>
        </a>

        <a
          href="./aktivitas.html"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white text-[11px] hover:bg-[#0a3d67] transition">
          <iconify-icon icon="solar:history-linear" width="18"></iconify-icon>
          <span>Aktivitas</span>
        </a>

        <a
          href="./tambahBuku.html"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white text-[11px] hover:bg-[#0a3d67] transition">
          <iconify-icon icon="solar:book-2-outline" class="text-[18px] text-white" ></iconify-icon>
          <span>Tambah Buku </span>
        </a>

        <a
          href="./akun.html"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white text-[11px] hover:bg-[#0a3d67] transition">
          <iconify-icon
            icon="iconamoon:profile-light"
            width="19"
          ></iconify-icon>
          <span>Akun</span>
        </a>
      </nav>
    </aside>

    <!-- NAVBAR -->
     <main class="ml-[230px] min-h-screen">
      <header
        class="h-[58px] border-0 border-b border-gray-400 bg-white flex items-center justify-between px-7">
        <div class="flex items-center gap-4">
          <div class="relative w-[260px]">
            <iconify-icon
              icon="solar:magnifer-linear"
              width="16"
              class="absolute left-3 top-1/2 -translate-y-1 text-black"
            ></iconify-icon>
            <input
              type="text"
              placeholder="Cari buku, penulis, atau kategori..."
              class="w-100 h-8 rounded-lg bg-[#dfe0e0] pl-9 pr-3 text-[9px] text-black"
            />
          </div>
        </div>

        <div class="flex items-center gap-5 mr-7">
          <a href="./notifikasi.html" class="relative text-[#13315C]">
            <iconify-icon
              icon="clarity:notification-line"
              width="19"
            ></iconify-icon>
            <span class="w-[10px] h-[10px]"></span>
          </a>

          <!-- AKUN -->
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full overflow-hidden">
              <img
                src="./assets/academy.jpg"
                alt="Foto Profil"
                class="w-full h-full object-cover"
              />
            </div>
            <div class="leading-tight">
              <p class="text-[10px] font-bold text-[#13315C]">Hakim</p>
              <p class="text-[8px] text-gray-400">Anggota</p>
            </div>
            <a href="./akun.html">
                <iconify-icon
                  icon="solar:alt-arrow-down-linear"
                  width="13"
                  class="text-gray-400 ml-5"
                ></iconify-icon>
            </a>
          </div>
        </div>
      </header>

  <!-- REKOMENDASI -->
     <section class="px-10 mt-8">
        <h2 class="text-2xl font-bold text-gray-800">
            Favorite
        </h2>
    <div class="flex gap-4 mt-6 mb-10">
        <button class="px-4 text-sm w-30 h-7 rounded-full border border-[#134074] text-[#134074] bg-white hover:bg-[#134074] hover:text-white transition-all duration-300onclick="filterCategory('Semua')">Semua</button>
        <button class="px-4 text-sm w-30 h-7 rounded-full border border-[#134074] text-[#134074] bg-white hover:bg-[#134074] hover:text-white transition-all duration-300" onclick="filterCategory('Romance')">Romance</button>
        <button class="px-4 text-sm w-30 h-7 rounded-full border border-[#134074] text-[#134074] bg-white hover:bg-[#134074] hover:text-white transition-all duration-300" onclick="filterCategory('Horor')">Horor</button>
        <button class="px-4 text-sm w-30 h-7 rounded-full border border-[#134074] text-[#134074] bg-white hover:bg-[#134074] hover:text-white transition-all duration-300" onclick="filterCategory('Sejarah')">Sejarah</button>
        <button class="px-4 text-sm w-30 h-7 rounded-full border border-[#134074] text-[#134074] bg-white hover:bg-[#134074] hover:text-white transition-all duration-300" onclick="filterCategory('Fiksi')">Fiksi</button>
        <button class="px-4 text-sm w-30 h-7 rounded-full border border-[#134074] text-[#134074] bg-white hover:bg-[#134074] hover:text-white transition-all duration-300" onclick="filterCategory('Islamic')">Islamic</button>
    </div>

    <div id="favorite" ></div>
    </section>

    </main>
    <script src="./favorite.js"></script>

</body>
</html>
