<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ruang Aksara</title>
    <link rel="stylesheet" href="./output.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
</head>

<body class="min-h-screen flex">
    <!-- LOGIN -->
    <div class="w-1/2 flex items-center justify-center bg-white px-8">
        <div class="w-full max-w-md">
            <div class="flex items-center gap-3 mb-10">
                <img
                    src="./assets/logo.png"
                    alt="logo"
                    class="h-15 w-20 object-contain"/>
                <h2 class="text-xl font-bold text-gray-900">Ruang Aksara</h2>
            </div>

            <!-- Judul -->
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900 mb-3 ">
                    Sig Up to your account
                </h1>
                <p class="text-sm text-gray-600">
                    Please enter your details
                </p>
            </div>


            <form>
                <!-- Username -->
                <div class="mb-5">
                    <label
                        for="email"
                        class="block text-sm font-medium text-gray-800 mb-2">
                            Username
                    </label>
                    <input
                        type="Username"
                        id="Username"
                        placeholder=""
                        class="w-full h-12 px-4 border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition">
                </div>
                <!-- Email -->
                <div class="mb-5">
                    <label
                        for="email"
                        class="block text-sm font-medium text-gray-800 mb-2">
                            Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        placeholder=""
                        class="w-full h-12 px-4 border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition">
                </div>

                <!-- Password -->
                <div class="mb-11">
                    <label
                        for="password"
                        class="block text-sm font-medium text-gray-800 mb-2">
                            Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        placeholder=""
                        class="w-full h-12 px-4 border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition">
                </div>

                <!-- Button -->
                <button
                    type="submit"
                    class="w-full h-12 bg-blue-900 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition duration-200">
                        Log in
                </button>
            </form>

            <div class="flex items-center gap-3 my-4">
                <div class="flex-1 h-px bg-gray-400"></div>
                <span class="text-gray-700 text-sm">Or</span>
                <div class="flex-1 h-px bg-gray-400"></div>
            </div>

            <!-- Google Sign In -->
            <button
                type="button"
                class="w-full h-12 border-2 shadow-1x border-gray-200 rounded-xl bg-white flex items-center justify-center gap-3">
                
                <iconify-icon
                    icon="logos:google-icon"
                    width="20"
                    height="20"
                ></iconify-icon>

                <span class="text-base">Sign In With Google</span>
            </button>

            <!-- Sign Up -->
            <p class="text-center text-sm text-gray-700 mt-7">
                Do you have account?
                <a
                    href="#"
                    class="text-blue-500 hover:text-blue-700">
                        Log In
                </a>
            </p>
        </div>
    </div>

    <div class="w-1/2 h-screen p-5">
        <div class="w-full h-full overflow-hidden rounded-3xl opacity-80">
            <img
                src="./assets/buku1.jpeg"
                alt="Login Image"
                class="w-full h-full object-cover"
            >
        </div>
    </div>

</body>
</html>
