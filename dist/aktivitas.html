<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktivitas</title>
    <link rel="stylesheet" href="./src/output.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>

<style>
/* =====================================================
   TABLET
   768px - 1024px
   ===================================================== */
@media (min-width: 768px) and (max-width: 1024px) {
    /* Sidebar */
    aside {
        width: 190px !important;
        padding-left: 15px !important;
        padding-right: 15px !important;
    }

    aside img {
        width: 60px !important;
        height: 60px !important;
    }

    aside h1 {
        font-size: 11px !important;
    }

    aside p {
        font-size: 6px !important;
    }

    aside nav {
        gap: 5px !important;
    }

    aside nav a,
    aside nav summary,
    aside nav button {
        padding: 9px 8px !important;
        font-size: 10px !important;
    }

    aside iconify-icon {
        width: 16px !important;
    }

    main {
        margin-left: 190px !important;
    }

    main header {
        padding-left: 20px !important;
        padding-right: 20px !important;
    }

    main header > div:first-child {
        width: 220px !important;
    }

    section > div:nth-child(2) > div {
        flex-wrap: wrap !important;
    }
}

/* =====================================================
   MOBILE
   320px - 767px
   ===================================================== */
@media (min-width: 320px) and (max-width: 767px) {
    html, body {
        width: 100% !important;
        overflow-x: hidden !important;
    }

    /* =================================================
       SIDEBAR
       ================================================= */
    aside {
        width: 230px !important;
        height: 100vh !important;
        z-index: 90 !important;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        overflow-y: auto !important;
    }

    aside.sidebar-open {
        transform: translateX(0);
    }

    #menuMobile {
        display: flex !important;
    }

    #sidebarOverlay {
        display: none;
    }

    #sidebarOverlay.overlay-open {
        display: block !important;
    }

    /* ================= MAIN CONTENT ================= */
    main {
        margin-left: 0 !important;
        width: 100% !important;
        min-height: auto !important;
    }

    /* ================= HEADER ================= */
    main header {
        height: 65px !important;
        padding-left: 60px !important; /* Ruang untuk tombol hamburger */
        padding-right: 12px !important;
        display: flex !important;
        flex-direction: row !important; /* Agar Search dan Profil sejajar */
        align-items: center !important;
        justify-content: space-between !important;
        gap: 10px !important;
    }

    main header > div:first-child {
        flex: 1 !important; /* Otomatis mengisi ruang yang tersisa */
        width: auto !important;
    }
    
    main header input {
        width: 100% !important;
        height: 32px !important;
        font-size: 9px !important;
    }

    /* Profile */
    main header > div:last-child {
        flex-shrink: 0 !important;
        margin-right: 0 !important;
        gap: 7px !important;
    }

    main header > div:last-child p {
        display: none !important;
    }

    main header img {
        width: 28px !important;
        height: 28px !important;
    }

    /* ================= SECTION CONTENT ================= */
    section {
        padding: 20px 15px !important;
    }

    section h2 {
        font-size: 24px !important;
    }

    /* ================= FILTER BUTTONS ================= */
    section > div:nth-child(2) > div {
        overflow-x: auto !important;
        flex-wrap: nowrap !important;
        padding-bottom: 8px !important;
    }
    
    section > div:nth-child(2) > div::-webkit-scrollbar {
        display: none !important;
    }

    section > div:nth-child(2) > div > button {
        flex: 0 0 auto !important;
        font-size: 11px !important;
        padding: 6px 16px !important;
    }
}

/* =====================================================
   MOBILE KECIL
   320px - 380px
   ===================================================== */
@media (min-width: 320px) and (max-width: 380px) {
    main header {
        padding-left: 55px !important;
        padding-right: 10px !important;
    }

    section {
        padding: 15px 12px !important;
    }

    section h2 {
        font-size: 20px !important;
    }

    section > div:nth-child(2) > div > button {
        font-size: 10px !important;
        padding: 5px 14px !important;
    }
}
</style>
</head>

<body class="bg-white">

<!-- HAMBURGER MOBILE -->
<button
    id="menuMobile"
    onclick="toggleSidebar()"
    class="hidden fixed top-4 left-4 z-[80] w-10 h-10 bg-[#0a3d67] text-white rounded-lg items-center justify-center shadow-lg"
>
    <iconify-icon icon="solar:hamburger-menu-linear" width="22"></iconify-icon>
</button>

<!-- OVERLAY MOBILE -->
<div
    id="sidebarOverlay"
    onclick="toggleSidebar()"
    class="hidden fixed inset-0 bg-black/40 z-[80]"
></div>

<aside id="sidebar" class="fixed top-0 left-0 w-[230px] h-screen bg-slate-900 text-white px-5 py-5">

    <div class="flex items-center">
        <div class="w-20 h-20 flex items-center justify-center">
            <img
                src="../assets/logo.png"
                class="w-20 h-20 object-contain"
                alt="Logo"
            >
        </div>

        <div>
            <h1 class="font-bold text-[13px] tracking-wide">
                RUANG AKSARA
            </h1>

            <p class="text-[7px] text-gray-300">
                Perpustakaan Digital
            </p>
        </div>
    </div>

    <nav class="flex flex-col gap-2 mt-2">

        <a
            href="../dist/home.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-[#0a3d67] transition text-white text-[11px]"
        >
            <iconify-icon
                icon="akar-icons:home-alt1"
                width="18"
            ></iconify-icon>

            <span>Beranda</span>
        </a>

        <details class="group">
            <summary
                class="flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-[#0a3d67] transition text-white text-[11px] cursor-pointer list-none"
            >
                <a
                    href="./daftarKoleksi.html"
                    class="flex items-center gap-3"
                >
                
                    <iconify-icon icon="akar-icons:book" width="18"></iconify-icon>
                    <span>Daftar Koleksi</span>
                </a>

                <iconify-icon
                    icon="solar:alt-arrow-down-linear"
                    width="15"
                    class="transition-transform duration-300 group-open:rotate-180"
                ></iconify-icon>
            </summary>

            <div class="ml-9 mt-1 space-y-1">

                <a
                    href="../dist/daftarKoleksi.html?kategori=Romance"
                    class="block text-[12px] text-gray-300 hover:text-white py-1"
                >
                    Romance
                </a>

                <a
                    href="../dist/daftarKoleksi.html?kategori=Fiksi"
                    class="block text-[12px] text-gray-300 hover:text-white py-1"
                >
                    Fiksi
                </a>

                <a
                    href="../dist/daftarKoleksi.html?kategori=Mystery"
                    class="block text-[12px] text-gray-300 hover:text-white py-1"
                >
                    Mystery
                </a>

                <a
                    href="../dist/daftarKoleksi.html?kategori=Horor"
                    class="block text-[12px] text-gray-300 hover:text-white py-1"
                >
                    Horor
                </a>

                <a
                    href="../dist/daftarKoleksi.html?kategori=Sejarah"
                    class="block text-[12px] text-gray-300 hover:text-white py-1"
                >
                    Sejarah
                </a>

            </div>
        </details>

        <a
            href="../dist/bukuFavorit.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-[#0a3d67] transition text-white text-[11px]"
        >
            <iconify-icon
                icon="lucide:bookmark"
                width="18"
            ></iconify-icon>

            <span>Buku Favorit</span>
        </a>

        <a
            href="../dist/keranjang.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-[#0a3d67] transition text-white text-[11px]"
        >
            <iconify-icon
                icon="eva:shopping-bag-outline"
                width="19"
            ></iconify-icon>

            <span>Keranjang</span>
        </a>

        <a
            href="../dist/aktivitas.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-[#0a3d67] text-white text-[11px]"
        >
            <iconify-icon
                icon="solar:history-linear"
                width="18"
            ></iconify-icon>

            <span>Aktivitas</span>
        </a>

        <a
            href="../dist/tambahBuku.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-[#0a3d67] transition text-white text-[11px]"
        >
            <iconify-icon
                icon="solar:book-2-outline"
                width="18"
            ></iconify-icon>

            <span>Tambah Buku</span>
        </a>

        <a
            href="../dist/akun.html"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-[#0a3d67] transition text-white text-[11px]"
        >
            <iconify-icon
                icon="iconamoon:profile-light"
                width="19"
            ></iconify-icon>

            <span>Akun</span>
        </a>

        <button
            onclick="logout()"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-[#0a3d67] transition text-white text-[11px] text-left"
        >
            <iconify-icon
                icon="solar:logout-2-outline"
                width="19"
            ></iconify-icon>

            <span>Logout</span>
        </button>

    </nav>
</aside>

<main class="ml-[230px] min-h-screen">

    <header class="h-[58px] border-b border-gray-300 bg-white flex items-center justify-between px-7">

        <div class="relative w-[260px]">
            <iconify-icon
                icon="solar:magnifer-linear"
                width="16"
                class="absolute left-3 top-1/2 -translate-y-1/2 text-black"
            ></iconify-icon>

            <input
                type="text"
                placeholder="Cari buku, penulis, atau kategori..."
                class="w-full h-8 rounded-lg bg-[#dfe0e0] pl-9 pr-3 text-[9px] text-black outline-none"
            >
        </div>

        <div class="flex items-center gap-5 mr-7">

            <button
                class="relative text-[#13315C]"
                onclick="window.location.href='./notifikasi.html'"
            >
                <iconify-icon
                    icon="clarity:notification-line"
                    width="19"
                ></iconify-icon>

                <span
                    id="jumlahNotifikasi"
                    class="absolute -top-2 -right-2 min-w-[15px] h-[15px] px-1 bg-red-500 text-white text-[8px] rounded-full flex items-center justify-center"
                >
                    0
                </span>
            </button>

            <div class="flex items-center gap-2">

                <div class="w-8 h-8 rounded-full overflow-hidden">
                    <img
                        id="fotoUser"
                        src="../assets/kucing.jpg"
                        alt="Foto Profil"
                        class="w-full h-full object-cover"
                    >
                </div>

                <div class="leading-tight">
                    <p
                        id="namaUser"
                        class="text-[10px] font-bold text-[#13315C]"
                    >
                        User
                    </p>

                    <p
                        id="emailUser"
                        class="text-[8px] text-gray-400"
                    ></p>
                </div>

                <a href="./akun.html">
                    <iconify-icon
                        icon="solar:alt-arrow-down-linear"
                        width="13"
                        class="text-gray-400 ml-5"
                    ></iconify-icon>
                </a>

            </div>
        </div>
    </header>

    <section class="w-full bg-white px-6 py-8 min-h-[calc(100vh-58px)]">

        <div class="flex items-center justify-between mb-5 px-3">

            <div>
                <h2 class="text-[30px] font-bold text-[#173866]">
                    Aktivitas
                </h2>

                <p class="text-[11px] text-gray-400 mt-1">
                    Riwayat peminjaman buku kamu.
                </p>
            </div>

        </div>

        <div class="w-full px-3 mb-6">

            <div class="flex items-center gap-2">

                <button
                    onclick="tampilkanRiwayat('Semua')"
                    class="px-5 py-1 rounded-full bg-[#123b67] text-white text-sm border border-[#123b67]"
                >
                    Semua
                </button>

                <button
                    onclick="tampilkanRiwayat('Dikembalikan')"
                    class="px-5 py-1 rounded-full hover:text-white transition hover:bg-[#0a3d67] bg-white text-black text-sm border border-gray-700"
                >
                    Dikembalikan
                </button>

                <button
                    onclick="tampilkanRiwayat('Terlambat')"
                    class="px-5 py-1 rounded-full hover:text-white transition hover:bg-[#0a3d67] bg-white text-black text-sm border border-gray-700"
                >
                    Terlambat
                </button>

                <button
                    onclick="tampilkanRiwayat('Dipinjam')"
                    class="px-5 py-1 rounded-full hover:text-white transition hover:bg-[#0a3d67] bg-white text-black text-sm border border-gray-700"
                >
                    Dipinjam
                </button>

            </div>

        </div>

        <div
            id="riwayatPeminjaman"
            class="w-full px-3 space-y-5"
        ></div>

    </section>

</main>

<script src="../js/aktivitas.js"></script>
<script src="../js/logout.js"></script>
<script src="../js/notifikasi.js"></script>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.toggle('sidebar-open');
        overlay.classList.toggle('overlay-open');
    }
</script>

</body>
</html>
