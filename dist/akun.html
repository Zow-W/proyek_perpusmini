<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akun</title>
  <link rel="stylesheet" href="./src/output.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>

  <style>
    .tab-button {
      position: relative;
      padding-bottom: 14px;
      font-size: 12px;
      font-weight: 500;
      color: #8b929c;
      transition: 0.2s;
    }

    .tab-button:hover {
      color: #13315C;
    }

    .active-tab {
      color: #13315C;
      font-weight: 700;
    }

    .active-tab::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background-color: #13315C;
      border-radius: 5px 5px 0 0;
    }
  </style>
</head>

<body class="bg-gray-50">

  <aside class="fixed top-0 left-0 w-[230px] h-screen bg-slate-900 text-white px-5 py-5">

    <div class="flex items-center">
      <div class="w-20 h-20 flex items-center justify-center">
        <img
          src="../assets/logo.png"
          class="w-20 h-20 object-contain"
          alt="Logo"
        >
      </div>

      <div>
        <h1 class="font-bold text-[13px] tracking-wide">
          RUANG AKSARA
        </h1>

        <p class="text-[7px] text-gray-300">
          Perpustakaan Digital
        </p>
      </div>
    </div>

    <nav class="flex flex-col gap-2 mt-2">

      <a
        href="../dist/home.html"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-[#0a3d67] transition text-white text-[11px]"
      >
        <iconify-icon
          icon="akar-icons:home-alt1"
          width="18"
        ></iconify-icon>

        <span>Beranda</span>
      </a>

      <details class="group">

        <summary
          class="flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-[#0a3d67] transition text-white text-[11px] cursor-pointer list-none"
        >
          <div class="flex items-center gap-3">
            <iconify-icon
              icon="akar-icons:book"
              width="18"
            ></iconify-icon>

            <a href="./daftarKoleksi.html">
              Daftar Koleksi
            </a>
          </div>

          <iconify-icon
            icon="solar:alt-arrow-down-linear"
            width="15"
            class="transition-transform duration-300 group-open:rotate-180"
          ></iconify-icon>
        </summary>

        <div class="ml-9 mt-1 space-y-1">

          <a
            href="#"
            class="block text-[12px] text-gray-300 hover:text-white py-1"
          >
            Romance
          </a>

          <a
            href="#"
            class="block text-[12px] text-gray-300 hover:text-white py-1"
          >
            Fiksi
          </a>

          <a
            href="#"
            class="block text-[12px] text-gray-300 hover:text-white py-1"
          >
            Survive
          </a>

          <a
            href="#"
            class="block text-[12px] text-gray-300 hover:text-white py-1"
          >
            Horror
          </a>

          <a
            href="#"
            class="block text-[12px] text-gray-300 hover:text-white py-1"
          >
            Thriller
          </a>

          <a
            href="#"
            class="block text-[12px] text-gray-300 hover:text-white py-1"
          >
            Islamic
          </a>

        </div>
      </details>

      <a
        href="./bukuFavorit.html"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white text-[11px] hover:bg-[#0a3d67] transition"
      >
        <iconify-icon
          icon="lucide:bookmark"
          width="18"
        ></iconify-icon>

        <span>Buku Favorit</span>
      </a>

      <a
        href="./keranjang.html"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white text-[11px] hover:bg-[#0a3d67] transition"
      >
        <iconify-icon
          icon="eva:shopping-bag-outline"
          width="19"
        ></iconify-icon>

        <span>Keranjang</span>
      </a>

      <a
        href="./aktivitas.html"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white text-[11px] hover:bg-[#0a3d67] transition"
      >
        <iconify-icon
          icon="solar:history-linear"
          width="18"
        ></iconify-icon>

        <span>Aktivitas</span>
      </a>

      <a
        href="./tambahBuku.html"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white text-[11px] hover:bg-[#0a3d67] transition"
      >
        <iconify-icon
          icon="solar:book-2-outline"
          width="18"
        ></iconify-icon>

        <span>Tambah Buku</span>
      </a>

      <a
        href="#"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-[#0a3d67] text-white text-[11px]"
      >
        <iconify-icon
          icon="iconamoon:profile-light"
          width="19"
        ></iconify-icon>

        <span>Akun</span>
      </a>

      <button
        onclick="logout()"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white text-[11px] hover:bg-[#0a3d67] transition"
      >
        <iconify-icon
          icon="solar:logout-2-outline"
          width="19"
        ></iconify-icon>

        <span>Logout</span>
      </button>

    </nav>
  </aside>

  <main class="ml-[230px] min-h-screen">

    <section>

      <div class="bg-white shadow-sm overflow-hidden">

        <img
          src="../assets/Swiss.jpg"
          class="h-[270px] w-full object-cover"
          alt="Cover Profile"
        >

        <div class="px-8 pb-0">

          <div class="flex flex-col md:flex-row md:items-end gap-5">

            <div class="-mt-20 relative z-10">

              <div class="w-[140px] h-[140px] rounded-full bg-white p-1 shadow-md">

                <img
                  src="../assets/kucing.jpg"
                  alt="Foto Profile"
                  class="w-full h-full rounded-full object-cover"
                >

              </div>

            </div>

            <div class="pb-5">

              <h2
                id="namaProfile"
                class="text-[22px] font-bold text-[#1d2939]"
              >
                User
              </h2>

              <p
                id="usernameProfile"
                class="text-[13px] text-gray-500 mt-1"
              >
                @username
              </p>

            </div>

          </div>

        </div>

        <div class="flex items-center gap-8 border-b border-gray-200 mt-8 px-8">

          <button
            onclick="showTab('details', this)"
            class="tab-button active-tab"
          >
            My Details
          </button>

          <button
            onclick="showTab('favorite', this)"
            class="tab-button"
          >
            Buku Favorit
          </button>

        </div>

        <div class="px-8 pb-10">

          <div id="details" class="tab-content pt-8">

            <h2 class="text-[20px] font-bold text-[#1d2939]">
              My Details
            </h2>

            <div class="mt-7">

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>

                  <label class="block text-[12px] font-medium text-gray-600 mb-2">
                    Nama Lengkap
                  </label>

                  <input
                    type="text"
                    value=""
                    class="w-full h-11 px-4 border border-gray-300 rounded-lg text-[13px] outline-none focus:border-[#13315C]"
                  >

                </div>

                <div>

                  <label class="block text-[12px] font-medium text-gray-600 mb-2">
                    Email Address
                  </label>

                  <input
                    type="email"
                    value=""
                    class="w-full h-11 px-4 border border-gray-300 rounded-lg text-[13px] outline-none focus:border-[#13315C]"
                  >

                </div>

              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">

                <div>

                  <label class="block text-[12px] font-medium text-gray-600 mb-2">
                    Username
                  </label>

                  <input
                    type="text"
                    value=""
                    class="w-full h-11 px-4 border border-gray-300 rounded-lg text-[13px] outline-none focus:border-[#13315C]"
                  >

                </div>

                <div>

                  <label class="block text-[12px] font-medium text-gray-600 mb-2">
                    Nomor Telepon
                  </label>

                  <input
                    type="text"
                    value=""
                    class="w-full h-11 px-4 border border-gray-300 rounded-lg text-[13px] outline-none focus:border-[#13315C]"
                  >

                </div>

              </div>

              <div class="mt-6">

                <label class="block text-[12px] font-medium text-gray-600 mb-2">
                  Bio
                </label>

                <textarea
                  rows="5"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg text-[13px] outline-none resize-none focus:border-[#13315C]"
                >Saya adalah pengguna Ruang Aksara yang senang membaca berbagai jenis buku, terutama novel dan buku fiksi.</textarea>

              </div>

              <button
                onclick="saveProfile()"
                class="mt-6 px-6 py-3 bg-[#13315C] text-white rounded-lg text-[12px] font-semibold hover:bg-[#0a3d67] transition"
              >
                Simpan Perubahan
              </button>

            </div>
          </div>

          <div
            id="favorite"
            class="tab-content pt-8 hidden"
          >

            <h2 class="text-[20px] font-bold text-[#1d2939]">
              Buku Favorit
            </h2>

            <div
              id="favoriteProfile"
              class="mt-6"
            ></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/akun.js"></script>
  <script src="../dist/logout.js"></script>

</body>
</html>
