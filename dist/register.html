<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Ruang Aksara</title>
    <link rel="stylesheet" href="../output.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <style>
/* TABLET */
@media (min-width: 768px) and (max-width: 1024px) {

    body {
        min-height: 100vh !important;
        overflow-x: hidden !important;
    }

    /* ================= FORM ================= */

    body > div:first-child {
        width: 55% !important;
        padding-left: 35px !important;
        padding-right: 35px !important;
        box-sizing: border-box !important;
    }

    body > div:first-child > div {
        width: 100% !important;
        max-width: 400px !important;
    }

    /* Logo */
    body > div:first-child img {
        width: 60px !important;
        height: 50px !important;
    }

    body > div:first-child h2 {
        font-size: 18px !important;
    }

    /* Judul */
    body > div:first-child h1 {
        font-size: 22px !important;
        line-height: 1.3 !important;
    }

    body > div:first-child p {
        font-size: 12px !important;
    }

    /* Label */
    body > div:first-child label {
        font-size: 12px !important;
    }

    /* Input */
    body > div:first-child input {
        height: 44px !important;
        font-size: 12px !important;
    }

    /* Button */
    body > div:first-child form button {
        height: 44px !important;
        font-size: 12px !important;
    }

    /* Google */
    body > div:first-child > div > button {
        height: 44px !important;
    }

    body > div:first-child > div > button span {
        font-size: 13px !important;
    }

    /* ================= GAMBAR ================= */

    body > div:last-of-type {
        width: 45% !important;
        height: 100vh !important;
        padding: 15px !important;
        box-sizing: border-box !important;
    }

    body > div:last-of-type > div {
        border-radius: 24px !important;
    }
}

/* MOBILE */
@media (min-width: 320px) and (max-width: 767px) {

    body {
        min-height: 100vh !important;
        display: flex !important;
        flex-direction: column !important;
        overflow-x: hidden !important;
    }

    /* ================= FORM ================= */

    body > div:first-child {
        width: 100% !important;
        min-height: auto !important;
        padding: 30px 22px 25px !important;
        box-sizing: border-box !important;

        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
    }

    body > div:first-child > div {
        width: 100% !important;
        max-width: 100% !important;
    }


    /* ================= LOGO ================= */

    body > div:first-child > div > div:first-child {
        margin-bottom: 25px !important;
        gap: 8px !important;
    }

    body > div:first-child img {
        width: 45px !important;
        height: 40px !important;
    }

    body > div:first-child h2 {
        font-size: 16px !important;
    }


    /* ================= JUDUL ================= */

    body > div:first-child > div > div:nth-child(2) {
        margin-bottom: 20px !important;
    }

    body > div:first-child h1 {
        font-size: 20px !important;
        line-height: 1.3 !important;
        margin-bottom: 8px !important;
    }

    body > div:first-child > div > div:nth-child(2) p {
        font-size: 12px !important;
    }


    /* ================= LABEL ================= */

    body > div:first-child label {
        font-size: 12px !important;
        margin-bottom: 6px !important;
    }


    /* ================= INPUT ================= */

    body > div:first-child input {
        width: 100% !important;
        height: 44px !important;
        padding: 0 13px !important;

        font-size: 12px !important;
        box-sizing: border-box !important;
    }

    body > div:first-child form > div {
        margin-bottom: 14px !important;
    }

    body > div:first-child form > div:nth-child(3) {
        margin-bottom: 18px !important;
    }


    /* ================= PESAN ERROR ================= */

    #pesan {
        font-size: 11px !important;
        margin-bottom: 10px !important;
    }


    /* ================= REGISTER BUTTON ================= */

    body > div:first-child form button {
        width: 100% !important;
        height: 44px !important;

        font-size: 12px !important;
        border-radius: 8px !important;
    }


    /* ================= OR ================= */

    body > div:first-child > div > div:nth-of-type(3) {
        margin-top: 15px !important;
        margin-bottom: 15px !important;
    }

    body > div:first-child > div > div:nth-of-type(3) span {
        font-size: 11px !important;
    }


    /* ================= GOOGLE BUTTON ================= */

    body > div:first-child > div > button {
        width: 100% !important;
        height: 44px !important;

        gap: 8px !important;
        border-radius: 10px !important;
    }

    body > div:first-child > div > button span {
        font-size: 12px !important;
    }


    /* ================= LOGIN TEXT ================= */

    body > div:first-child > div > p:last-child {
        font-size: 11px !important;
        margin-top: 18px !important;
    }


    /* ================= GAMBAR MOBILE ================= */

@media (min-width: 320px) and (max-width: 767px) {

    body > div:last-of-type {
        display: none !important;
    }

    body > div:first-child {
        width: 100% !important;
        min-height: 100vh !important;
        padding: 30px 22px !important;
        box-sizing: border-box !important;
    }
}
}
</style>
</head>

<body class="min-h-screen flex">
    <div class="w-1/2 flex items-center justify-center bg-white px-8">
        <div class="w-full max-w-md">
            <div class="flex items-center gap-3 mb-8">
                <img
                    src="../assets/logo.png"
                    alt="logo"
                    class="h-15 w-20 object-contain">
                <h2 class="text-xl font-bold text-gray-900">Ruang Aksara</h2>
            </div>

            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900 mb-3">
                    Sign Up to your account
                </h1>
                <p class="text-sm text-gray-600">
                    Please enter your details
                </p>
            </div>

            <form onsubmit="register(event)">
                <div class="mb-4">
                    <label
                        for="username"
                        class="block text-sm font-medium text-gray-800 mb-2">
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        class="w-full h-12 px-4 border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition">
                </div>

                <div class="mb-4">
                    <label
                        for="email"
                        class="block text-sm font-medium text-gray-800 mb-2">
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        class="w-full h-12 px-4 border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition">
                </div>

                <div class="mb-6">
                    <label
                        for="password"
                        class="block text-sm font-medium text-gray-800 mb-2">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        class="w-full h-12 px-4 border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition">
                </div>

                <p id="pesan" class="text-red-500 text-sm mb-3"></p>

                <button
                    type="submit"
                    class="w-full h-12 bg-blue-900 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition duration-200">
                    Register
                </button>
            </form>

            <div class="flex items-center gap-3 my-4">
                <div class="flex-1 h-px bg-gray-400"></div>
                <span class="text-gray-700 text-sm">Or</span>
                <div class="flex-1 h-px bg-gray-400"></div>
            </div>

            <button
                type="button"
                class="w-full h-12 border-2 shadow-lg border-gray-200 rounded-xl bg-white flex items-center justify-center gap-3">
                <iconify-icon
                    icon="logos:google-icon"
                    width="20"
                    height="20">
                </iconify-icon>
                <span class="text-base">Sign Up With Google</span>
            </button>

            <p class="text-center text-sm text-gray-700 mt-6">
                Do you have account?
                <a
                    href="../dist/login.html"
                    class="text-blue-500 hover:text-blue-700">
                    Log In
                </a>
            </p>
        </div>
    </div>

    <div class="w-1/2 h-screen p-5">
        <div class="w-full h-full overflow-hidden rounded-3xl opacity-80">
            <img
                src="../assets/buku1.jpeg"
                alt="Register Image"
                class="w-full h-full object-cover">
        </div>
    </div>

    <script src="../js/register.js"></script>
</body>
</html>
