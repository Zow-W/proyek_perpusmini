<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Ruang Aksara</title>
    <link rel="stylesheet" href="../output.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  </head>

  <body class="min-h-screen flex">
    <!-- GAMBAR KIRI -->
    <div class="w-1/2 h-screen p-8">
        <div class="w-full h-full overflow-hidden rounded-3xl opacity-80">
            <img
                src="../assets/buku1.jpeg"
                alt="Login Image"
                class="w-full h-full object-cover">
        </div>
    </div>

    <!-- LOGIN KANAN -->
    <div class="w-1/2 flex items-center justify-center  bg-white px-8">
      <div class="w-full max-w-md mb-20">
        <div class="flex items-center gap-3 mb-10">
          <img
            src="../assets/logo.png"
            alt="logo"
            class="h-15 w-20 object-contain"/>
          <h2 class="text-xl font-bold text-gray-900">Ruang Aksara</h2>
        </div>

        <div class="mb-50">
          <!-- Judul -->
          <div class="mb-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">
              Log in to your account
            </h1>
            <p class="text-sm text-gray-600">Please enter your details</p>
          </div>

         <!-- Form -->
<form onsubmit="temukan(event)">

  <!-- Username -->
  <div class="mb-5">
    <label
      for="username"
      class="block text-sm font-medium text-gray-800 mb-2"
    >
      Username
    </label>

    <input
      type="text"
      id="username"
      class="w-full h-12 px-4 border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition"
    />
  </div>


  <!-- Password -->
  <div class="mb-5">
    <label
      for="password"
      class="block text-sm font-medium text-gray-800 mb-2"
    >
      Password
    </label>

    <input
      type="password"
      id="password"
      class="w-full h-12 px-4 border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition"
    />
  </div>


  <!-- Pesan error -->
  <p
    id="pesan"
    class="text-red-500 text-sm mb-4"
  ></p>


  <!-- Button -->
  <button
    type="submit"
    class="w-full h-12 bg-blue-900 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition duration-200"
  >
    Log in
  </button>

</form>


<div class="flex items-center gap-3 my-4">
  <div class="flex-1 h-px bg-gray-400"></div>
  <span class="text-gray-700 text-sm">Or</span>
  <div class="flex-1 h-px bg-gray-400"></div>
</div>


<!-- Google -->
<button
  type="button"
  class="w-full h-12 border-2 shadow-lg border-gray-200 rounded-xl bg-white flex items-center justify-center gap-3"
>
  <iconify-icon
    icon="logos:google-icon"
    width="20"
    height="20"
  ></iconify-icon>

  <span class="text-base">
    Sign In With Google
  </span>
</button>


<!-- Sign Up -->
<p class="text-center text-sm text-gray-700 mt-20">
  Don't have account?

  <a
    href="../dist/register.html"
    class="text-blue-500 hover:text-blue-700"
  >
    Sign Up
  </a>
</p>

    </div>


<!-- INI HARUS login.js -->
<script src="../js/login.js"></script>
  </body>
</html>
