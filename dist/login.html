<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ruang Aksara</title>
  <link rel="stylesheet" href="../output.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <style>
/* tablet */
@media (min-width: 768px) and (max-width: 1024px) {

    body {
        overflow-y: auto !important;
        overflow-x: hidden !important;
    }

    /* GAMBAR KIRI */
    body > div:first-child {
        width: 45% !important;
        height: 100vh !important;
        padding: 25px !important;
    }

    body > div:first-child > div {
        border-radius: 24px !important;
    }

    /* FORM KANAN */
    body > div:last-of-type {
        width: 55% !important;
        height: 100vh !important;
        padding: 35px !important;
    }

    body > div:last-of-type > div {
        width: 100% !important;
        max-width: 420px !important;
    }

    /* LOGO */
    body > div:last-of-type img {
        height: 55px !important;
        width: 70px !important;
    }

    /* JUDUL */
    body > div:last-of-type h1 {
        font-size: 22px !important;
    }

    /* INPUT */
    body > div:last-of-type input {
        height: 46px !important;
    }

    /* BUTTON */
    body > div:last-of-type button {
        height: 46px !important;
    }

    /* GOOGLE */
    body > div:last-of-type button span {
        font-size: 14px !important;
    }
}

/* MOBILE */
@media (min-width: 320px) and (max-width: 767px) {

    body {
        width: 100% !important;
        min-height: 100vh !important;
        height: auto !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        display: block !important;
    }

    /* HILANGKAN GAMBAR */
    body > div:first-child {
        display: none !important;
    }

    /* FORM MEMENUHI LAYAR */
    body > div:last-of-type {
        width: 100% !important;
        min-height: 100vh !important;
        height: auto !important;
        padding: 30px 22px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-sizing: border-box !important;
    }

    body > div:last-of-type > div {
        width: 100% !important;
        max-width: 100% !important;
    }

    /* LOGO */
    body > div:last-of-type img {
        height: 50px !important;
        width: 65px !important;
    }

    /* NAMA RUANG AKSARA */
    body > div:last-of-type h2 {
        font-size: 18px !important;
    }

    /* JUDUL LOGIN */
    body > div:last-of-type h1 {
        font-size: 21px !important;
        line-height: 1.3 !important;
    }

    /* INPUT */
    body > div:last-of-type input {
        width: 100% !important;
        height: 46px !important;
        font-size: 14px !important;
    }

    /* BUTTON */
    body > div:last-of-type button {
        width: 100% !important;
        height: 46px !important;
    }

    /* GOOGLE TEXT */
    body > div:last-of-type button span {
        font-size: 14px !important;
    }

    /* JARAK BAWAH */
    body > div:last-of-type p {
        font-size: 13px !important;
    }
}
</style>
</head>

<body class="h-screen overflow-hidden flex">
  <div class="w-1/2 h-screen p-8">
    <div class="w-full h-full overflow-hidden rounded-3xl opacity-80">
      <img
        src="../assets/buku1.jpeg"
        alt="Login Image"
        class="w-full h-full object-cover"
      >
    </div>
  </div>

  <div class="w-1/2 h-screen flex items-center justify-center bg-white px-8">
    <div class="w-full max-w-md">
      <div class="flex items-center gap-3 mb-8">
        <img
          src="../assets/logo.png"
          alt="Logo"
          class="h-15 w-20 object-contain"
        >
        <h2 class="text-xl font-bold text-gray-900">
          Ruang Aksara
        </h2>
      </div>

      <div>
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-gray-900 mb-2">
            Log in to your account
          </h1>
          <p class="text-sm text-gray-600">
            Please enter your details
          </p>
        </div>

        <form onsubmit="temukan(event)">
          <div class="mb-4">
            <label
              for="username"
              class="block text-sm font-medium text-gray-800 mb-2"
            >
              Username
            </label>

            <input
              type="text"
              id="username"
              class="w-full h-12 px-4 border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition"
            >
          </div>

          <div class="mb-4">
            <label
              for="password"
              class="block text-sm font-medium text-gray-800 mb-2"
            >
              Password
            </label>

            <input
              type="password"
              id="password"
              class="w-full h-12 px-4 border border-gray-300 rounded-lg text-sm outline-none focus:border-blue-700 focus:ring-1 focus:ring-blue-700 transition"
            >
          </div>

          <p
            id="pesan"
            class="text-red-500 text-sm mb-3"
          ></p>

          <button
            type="submit"
            class="w-full h-12 bg-blue-900 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition duration-200"
          >
            Log in
          </button>
        </form>

        <div class="flex items-center gap-3 my-4">
          <div class="flex-1 h-px bg-gray-400"></div>
          <span class="text-gray-700 text-sm">Or</span>
          <div class="flex-1 h-px bg-gray-400"></div>
        </div>

        <button
          type="button"
          class="w-full h-12 border-2 shadow-lg border-gray-200 rounded-xl bg-white flex items-center justify-center gap-3"
        >
          <iconify-icon
            icon="logos:google-icon"
            width="20"
            height="20"
          ></iconify-icon>

          <span class="text-base">
            Sign In With Google
          </span>
        </button>

        <p class="text-center text-sm text-gray-700 mt-10">
          Don't have account?

          <a
            href="../dist/register.html"
            class="text-blue-500 hover:text-blue-700"
          >
            Sign Up
          </a>
        </p>
      </div>
    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
